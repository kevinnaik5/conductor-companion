<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conductor Ticketing Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- Viewer shell: passenger list · phone · one-step panel ---------- */
body { padding: 0; min-height: 100vh; background: #E9EDF3; }
.app { min-height: 100vh; display: grid; grid-template-columns: 216px auto 340px; gap: 40px; align-items: center; justify-content: center; padding: 24px; }
.list h1, .panel .k { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5B6577; margin: 0 0 12px; }
.list ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.list button { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 0; border-radius: 10px; background: transparent;
  font: 500 15px 'IBM Plex Sans', 'IBM Plex Sans Devanagari'; color: #1A2333; text-align: left; cursor: pointer; }
.list button:hover { background: #DDE4EE; }
.list button .n { width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; background: #fff; color: #5B6577; border: 1.5px solid #C5CED9; }
.list button[aria-current="true"] { background: #0B1F3A; color: #fff; font-weight: 600; }
.list button[aria-current="true"] .n { background: #fff; color: #0B1F3A; border-color: #fff; }
.list button.done .n { background: #0B5E45; color: #fff; border-color: #0B5E45; }
.list button:focus-visible, .panel button:focus-visible, .hot:focus-visible { outline: 3px solid #00B8D4; outline-offset: 2px; }

.phonebox { position: relative; width: calc(360px * var(--s, 1)); height: calc(720px * var(--s, 1)); }
.scaler { position: absolute; left: 0; top: 0; width: 360px; height: 720px; transform: scale(var(--s, 1)); transform-origin: top left; }
.ring { position: absolute; border-radius: 10px; pointer-events: none; z-index: 20;
  box-shadow: 0 0 0 4px #FFC400, 0 0 0 9px rgba(255,196,0,.35); animation: pulse 1.2s ease-in-out infinite; }
.ring.look { box-shadow: 0 0 0 4px #00B8D4, 0 0 0 9px rgba(0,184,212,.3); animation: none; }
.finger { position: absolute; z-index: 21; pointer-events: none; font-size: 44px; color: #1A1820; filter: drop-shadow(0 2px 3px rgba(255,255,255,.9)); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px #FFC400, 0 0 0 14px rgba(255,196,0,.15); } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
.hot { cursor: pointer; }

.panel { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 1px 2px rgba(11,31,58,.08), 0 8px 24px rgba(11,31,58,.06); }
.panel .k { margin-bottom: 8px; }
.bars { display: flex; gap: 4px; margin-bottom: 20px; }
.bars i { flex: 1; height: 4px; border-radius: 2px; background: #DDE4EE; }
.bars i.on { background: #0B1F3A; }
.panel h2 { font-size: 20px; line-height: 1.3; font-weight: 600; margin: 0 0 16px; color: #0F1724; }
.do { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; font-size: 18px; line-height: 1.35; font-weight: 600; background: #FFF3C4; color: #2A1E00; }
.do.look { background: #DDF4F9; color: #003540; }
.do.none { background: #EEF2F7; color: #1A2333; }
.do .ms { font-size: 26px; flex-shrink: 0; }
.why { font-size: 15px; line-height: 1.5; color: #3D4757; margin: 14px 0 0; }
.why b { color: #0F1724; }
.summary { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 15px; }
.summary td { padding: 8px 0; border-bottom: 1px solid #E5EAF1; }
.summary td:last-child { text-align: right; font-weight: 700; }
.nav { display: flex; gap: 8px; margin-top: 24px; }
.nav button { height: 48px; border-radius: 10px; font: 600 15px 'IBM Plex Sans', 'IBM Plex Sans Devanagari'; padding: 0 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.nav .back { background: #fff; border: 1.5px solid #C5CED9; color: #1A2333; }
.nav .next { background: #0B1F3A; border: 0; color: #fff; margin-left: auto; }
.nav button:disabled { opacity: .35; cursor: default; }
.nav .ms { font-size: 20px; }
.tip { font-size: 13px; color: #5B6577; margin: 16px 0 0; display: flex; gap: 6px; align-items: center; }
.tip .ms { font-size: 16px; }

/* Narrow screens: list becomes a scrolling row, panel goes under the phone */
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 16px; padding: 16px; align-content: start; }
  .list { width: 100%; min-width: 0; }
  .list h1 { display: none; }
  .list ol { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .list button { white-space: nowrap; width: auto; background: #fff; }
  .panel { width: 100%; max-width: 420px; padding: 20px; }
}

/* ?shot=1: screen only, for PNG export */
body.shot { background: transparent; min-height: 0; }
body.shot .app { display: block; padding: 0; min-height: 0; }
body.shot .list, body.shot .panel { display: none; }
body.shot .device { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="app">
  <nav class="list" aria-label="Passengers"><h1>Passengers</h1><ol id="list"></ol></nav>
  <div class="phonebox" id="phonebox"><div class="scaler" id="scaler"><div class="device" id="device"></div></div></div>
  <section class="panel" id="panel" aria-live="polite"></section>
</div>

<script src="components.js"></script>
<script>
/* One shift moment at Pragati Maidan: card, cash, cash ×2, UPI. */
const base = { pending: { count: 0 } };
const S = (o = {}) => mainScreen({ ...base, ...o });

// Printed ticket preview shown in the side panel
const ticket = ({ no, from, to, pax = 'Adult × 1', fare, pay, time }) => `
  <div class="ticket" aria-label="Printed ticket preview">
    <div class="tk-h">DTC · Route 548 Up · Non-AC</div>
    <div class="tk-r"><b>${from} → ${to}</b></div>
    <div class="tk-row"><span>${pax}</span><span>${pay}</span></div>
    <div class="tk-fare">${fare}</div>
    <div class="tk-row"><span>Ticket #00${no}</span><span>13 Oct 2026 · ${time}</span></div>
  </div>`;

const AT_PM = 3, AT_BM = 4; // Pragati Maidan, Bhairon Marg
const steps = [
  {
    title: 'This is the home screen',
    act: ['none', 'info', 'Nothing to tap yet. The bus is at Pragati Maidan.'],
    why: '<b>Top half is for reading</b>: route, battery, printer, and the stop the bus is at (from GPS). <b>Bottom half is for tapping</b>, from bottom to top: fare buttons, passengers (Child, ×2…), payment (Cash, Card, UPI). Defaults are Cash, adult, 1 passenger.',
    screen: () => S({ last: { no: 42, pay: t('cash'), route: trip('Pragati Maidan', 'Ashram'), from: 'Pragati Maidan', to: 'Ashram', fare: '₹5', secs: 9 } }), served: 0,
  },
  {
    title: 'Every ticket: fare first, then the stop',
    act: ['look', 'record_voice_over', 'Passenger says where they\'re going. Conductor taps the fare, then that stop.'],
    look: '[data-name="FareButtons"]',
    why: 'DTC needs to know <b>where every passenger gets off</b>. The fare button opens a short list of only the stops at that price. The conductor taps the passenger\'s stop and the ticket prints.<br><br><b>No memorising prices:</b> each fare button shows the furthest stop it reaches from here: ₹5 <b>to Ashram</b>, ₹10 <b>to Jamia Nagar</b>, ₹15 <b>to Hamdard Nagar</b>. These update as the bus moves.',
    screen: () => S({ last: { no: 42, pay: t('cash'), route: trip('Pragati Maidan', 'Ashram'), from: 'Pragati Maidan', to: 'Ashram', fare: '₹5', secs: 9 } }), served: 0,
  },
  {
    title: 'Passenger 1: blue card, going to Okhla',
    act: ['tap', 'touch_app', 'Tap Card'],
    tap: '[data-name="Pay/Card"]',
    why: 'A blue card holds money, so the device needs the fare and the stop before it can charge the card.',
    screen: () => S({ last: { no: 42, pay: t('cash'), route: trip('Pragati Maidan', 'Ashram'), from: 'Pragati Maidan', to: 'Ashram', fare: '₹5', secs: 6 } }), taps: 1, served: 0,
  },
  {
    title: 'Okhla costs ₹10',
    act: ['tap', 'touch_app', 'Tap ₹10'],
    tap: '[data-name="FareButton/Slab2"]',
    why: 'Okhla is past Ashram (the ₹5 limit) but before Jamia Nagar, so it\'s under the button that says <b>to Jamia Nagar</b>: ₹10.',
    screen: () => S({ mods: { pay: 'card' }, last: { no: 42, pay: t('cash'), route: trip('Pragati Maidan', 'Ashram'), from: 'Pragati Maidan', to: 'Ashram', fare: '₹5', secs: 4 } }), taps: 1, served: 0,
  },
  {
    title: 'Only the ₹10 stops appear',
    act: ['tap', 'touch_app', 'Tap Okhla'],
    tap: '[data-name="StopButton/Okhla"]',
    why: 'The list opens right above the fare buttons, inside thumb reach, and shows only the stops that cost ₹10 <b>from Pragati Maidan</b>. The header says which stop the list is counted from. If that\'s wrong, <b>Change start</b> at the top of the list fixes it.<br><br>Tapped the wrong fare? Tap another fare and the list switches. Tap the same fare again to close it.',
    screen: () => S({ mods: { pay: 'card' }, row: { band: 1 }, last: { no: 42, pay: t('cash'), route: trip('Pragati Maidan', 'Ashram'), from: 'Pragati Maidan', to: 'Ashram', fare: '₹5', secs: 2 } }), taps: 1, served: 0,
  },
  {
    title: 'The device asks for the card',
    act: ['none', 'contactless', 'Passenger taps their card on the device.'],
    look: '[data-name="CardWait"]',
    why: 'If the passenger changes their mind, <b>Cancel</b> goes back and nothing is charged.',
    screen: () => S({ mods: { pay: 'card' }, overlay: cardWait({ no: 43, dest: 'Okhla' }) }), served: 0,
  },
  {
    title: '₹10 deducted, ticket printing',
    act: ['none', 'check_circle', 'Nothing to tap. This closes by itself.'],
    why: `<b>3 taps</b> for a blue card: Card, fare, stop.${ticket({ no: 43, from: 'Pragati Maidan', to: 'Okhla', fare: '₹10', pay: 'Blue card', time: '09:41' })}`,
    screen: () => S({ overlay: cardOverlay('blue', 43, { meta: `${rt('Pragati Maidan', 'Okhla')} · ${t('balance', '₹184')}` }) }), served: 1,
  },
  {
    title: 'The bus moves. GPS isn\'t sure',
    act: ['tap', 'touch_app', 'Tap Yes (or wait 4 s and it accepts by itself)'],
    tap: '[data-name="ActionSlot/Yes"]',
    why: `Because the stop lists are counted from the boarding stop, a wrong stop would show the wrong list. So <b>GPS suggests and the conductor always has the final say</b>:
      <ul class="rules">
        <li>The boarding stop is always on screen, and every stop list repeats it ("From …").</li>
        <li>When GPS isn't sure, it <b>asks</b> in yellow. The answer buttons (Yes / Change) appear down in the thumb zone. If nobody answers, it says yes after 4 s.</li>
        <li>If GPS is wrong, <b>Change</b> (here, or <b>Change start</b> in every stop list) picks the right one, and the lists rebuild at once.</li>
        <li>If GPS is lost, a big <b>Next stop</b> button lets the conductor move it along by hand.</li>
      </ul>`,
    screen: () => S({ at: AT_PM, gps: 'unsure', last: { no: 43, pay: t('blueCard'), route: trip('Pragati Maidan', 'Okhla'), from: 'Pragati Maidan', to: 'Okhla', fare: '₹10', secs: 10 } }), served: 1,
  },
  {
    title: 'Passenger 2: cash, going to Nizamuddin',
    act: ['tap', 'touch_app', 'Tap ₹5'],
    tap: '[data-name="FareButton/Slab1"]',
    why: 'The bus is now at <b>Bhairon Marg</b>. Look at the fare buttons: the labels moved on with the bus. ₹5 now reaches <b>Maharani Bagh</b> and ₹10 reaches <b>Batra Hospital</b>. Nizamuddin is well inside ₹5.',
    screen: () => S({ at: AT_BM, last: { no: 43, pay: t('blueCard'), route: trip('Pragati Maidan', 'Okhla'), from: 'Pragati Maidan', to: 'Okhla', fare: '₹10', secs: 6 } }), taps: 1, served: 1,
  },
  {
    title: 'Tap the stop, and it prints',
    act: ['tap', 'touch_app', 'Tap Nizamuddin'],
    tap: '[data-name="StopButton/Nizamuddin"]',
    why: 'There is no "Confirm" button on purpose. <b>Tapping the stop is the confirmation</b>, and the ticket prints right away.',
    screen: () => S({ at: AT_BM, row: { band: 0 }, last: { no: 43, pay: t('blueCard'), route: trip('Pragati Maidan', 'Okhla'), from: 'Pragati Maidan', to: 'Okhla', fare: '₹10', secs: 4 } }), taps: 1, served: 1,
  },
  {
    title: 'Printed. Undo is the safety net',
    act: ['look', 'visibility', 'The strip shows ticket #0044 printing.'],
    look: '.st',
    why: `The device vibrates and the printer sounds. Wrong fare or stop? <b>Undo</b> on this strip voids the ticket for ~15 s. <b>2 taps</b> for cash.${ticket({ no: 44, from: 'Bhairon Marg', to: 'Nizamuddin', fare: '₹5', pay: 'Cash', time: '09:43' })}`,
    screen: () => S({ at: AT_BM, status: { printer: 'busy' }, last: { kind: 'printing', no: 44, pay: t('cash'), route: trip('Bhairon Marg', 'Nizamuddin'), from: 'Bhairon Marg', to: 'Nizamuddin', fare: '₹5' } }), served: 2,
  },
  {
    title: 'Passengers 3 and 4: going to Hamdard Nagar',
    act: ['tap', 'touch_app', 'Tap ×2'],
    tap: '[data-name="Chip/×2"]',
    why: 'Two people, same stop, paying together. Options go on before the fare.',
    screen: () => S({ at: AT_BM, last: { no: 44, pay: t('cash'), route: trip('Bhairon Marg', 'Nizamuddin'), from: 'Bhairon Marg', to: 'Nizamuddin', fare: '₹5', secs: 13 } }), taps: 1, served: 2,
  },
  {
    title: 'The fare shows the total for two',
    act: ['tap', 'touch_app', 'Tap ₹30 (₹15 × 2)'],
    tap: '[data-name="FareButton/Slab3"]',
    why: 'With ×2 on, every fare button shows the doubled amount, so the conductor knows how much cash to take.',
    screen: () => S({ at: AT_BM, mods: { mult: 2 }, last: { no: 44, pay: t('cash'), route: trip('Bhairon Marg', 'Nizamuddin'), from: 'Bhairon Marg', to: 'Nizamuddin', fare: '₹5', secs: 11 } }), taps: 1, served: 2,
  },
  {
    title: '₹15 list: the last stop comes first',
    act: ['tap', 'touch_app', 'Tap Hamdard Nagar'],
    tap: '[data-name="StopButton/Hamdard Nagar"]',
    why: 'Most long-distance riders go to the end of the route, so the <b>terminal is always first</b> in the ₹15 list. The other ₹15 stops follow in route order. On a long route this is the only list that may scroll.',
    screen: () => S({ at: AT_BM, mods: { mult: 2 }, row: { band: 2 }, last: { no: 44, pay: t('cash'), route: trip('Bhairon Marg', 'Nizamuddin'), from: 'Bhairon Marg', to: 'Nizamuddin', fare: '₹5', secs: 9 } }), taps: 1, served: 2,
  },
  {
    title: 'Passenger 5 says "Okhla, cash"',
    act: ['tap', 'touch_app', 'Tap ₹10'],
    tap: '[data-name="FareButton/Slab2"]',
    why: 'Ticket #0045 is printing for the two passengers, and every option has reset to Cash, 1 passenger.',
    screen: () => S({ at: AT_BM, status: { printer: 'busy' }, last: { kind: 'printing', no: 45, pay: `${t('cash')} × 2`, route: trip('Bhairon Marg', 'Hamdard Nagar'), from: 'Bhairon Marg', to: 'Hamdard Nagar', fare: '₹30' } }), taps: 1, served: 4,
  },
  {
    title: '…then changes their mind: "I\'ll pay by UPI"',
    act: ['tap', 'touch_app', 'Tap Cancel in the stop list'],
    tap: '[data-name="StopRow/Cancel"]',
    why: `<b>Nothing is charged or printed until the last tap</b>, so cancelling is always safe. Every stage has a way out:
      <ul class="rules">
        <li><b>Options picked, no fare yet:</b> Cancel on the "New ticket" strip.</li>
        <li><b>Stop list open:</b> Cancel in the list, or tap the same fare again.</li>
        <li><b>Waiting for a card:</b> Cancel.</li>
        <li><b>QR on screen:</b> Cancel, bottom-left.</li>
        <li><b>Already printed:</b> Undo, for about 15 s.</li>
      </ul>`,
    screen: () => S({ at: AT_BM, row: { band: 1 } }), taps: 1, served: 4,
  },
  {
    title: 'Cancelled. Start again with UPI',
    act: ['tap', 'touch_app', 'Tap UPI'],
    tap: '[data-name="Pay/UPI"]',
    why: 'Back to the home screen with the defaults. No ticket was made. Now the conductor starts the UPI ticket. As soon as an option is picked, the strip turns into a <b>New ticket</b> strip with its own Cancel button.',
    screen: () => S({ at: AT_BM, last: { no: 45, pay: `${t('cash')} × 2`, route: trip('Bhairon Marg', 'Hamdard Nagar'), from: 'Bhairon Marg', to: 'Hamdard Nagar', fare: '₹30', secs: 8 } }), taps: 1, served: 4,
  },
  {
    title: 'Okhla is ₹10 from here',
    act: ['tap', 'touch_app', 'Tap ₹10'],
    tap: '[data-name="FareButton/Slab2"]',
    why: 'Every fare now shows a UPI tag, and the strip shows the ticket being built (UPI) with a Cancel button.',
    screen: () => S({ at: AT_BM, mods: { pay: 'upi' }, last: { no: 45, pay: `${t('cash')} × 2`, route: trip('Bhairon Marg', 'Hamdard Nagar'), from: 'Bhairon Marg', to: 'Hamdard Nagar', fare: '₹30', secs: 12 } }), taps: 1, served: 4,
  },
  {
    title: 'Pick the stop',
    act: ['tap', 'touch_app', 'Tap Okhla'],
    tap: '[data-name="StopButton/Okhla"]',
    why: 'Same list as before, now counted from Bhairon Marg. Tapping the stop opens the QR code instead of printing.',
    screen: () => S({ at: AT_BM, mods: { pay: 'upi' }, row: { band: 1 }, last: { no: 45, pay: `${t('cash')} × 2`, route: trip('Bhairon Marg', 'Hamdard Nagar'), from: 'Bhairon Marg', to: 'Hamdard Nagar', fare: '₹30', secs: 10 } }), taps: 1, served: 4,
  },
  {
    title: 'Show the QR to the passenger',
    act: ['tap', 'touch_app', 'Passenger scans, then tap "Scanned, next passenger"'],
    tap: '[data-name="UPI/ScannedNext"]',
    why: 'The conductor turns the device around and moves on as soon as the passenger has scanned. <b>No waiting</b> for the payment.<br><br>If the passenger can\'t pay, <b>Cancel</b> is bottom-left: in reach of the thumb, but smaller and separate from the main button so it isn\'t hit by accident.',
    screen: () => upiScreen({ no: 46, route: rt('Bhairon Marg', 'Okhla') }), taps: 1, served: 4,
  },
  {
    title: 'The payment waits in the UPI bar',
    act: ['look', 'visibility', 'The UPI tile shows 1 payment pending.'],
    look: '[data-name^="PendingWidget"]',
    why: 'The conductor can serve the next passenger. If the payment hasn\'t arrived after 1:00, this tile turns <b>red</b> as a reminder.',
    screen: () => S({ at: AT_BM, pending: { count: 1 }, last: { no: 45, pay: `${t('cash')} × 2`, route: trip('Bhairon Marg', 'Hamdard Nagar'), from: 'Bhairon Marg', to: 'Hamdard Nagar', fare: '₹30', secs: 6 } }), served: 4,
  },
  {
    title: 'Payment arrives, ticket prints on its own',
    act: ['none', 'check_circle', 'Nothing to tap.'],
    look: '[data-name^="PendingWidget"]',
    why: `The tile turns green and the ticket prints automatically. <b>4 taps</b> for UPI.${ticket({ no: 46, from: 'Bhairon Marg', to: 'Okhla', fare: '₹10', pay: 'UPI', time: '09:45' })}`,
    screen: () => S({ at: AT_BM, status: { printer: 'busy' }, pending: { paid: true }, last: { kind: 'printing', no: 46, pay: t('upi'), route: trip('Bhairon Marg', 'Okhla'), from: 'Bhairon Marg', to: 'Okhla', fare: '₹10' } }), served: 5,
  },
  {
    title: 'Passenger 6 taps a pink card first',
    act: ['tap', 'touch_app', 'Going to Ashram (a ₹5 distance): tap ₹5'],
    tap: '[data-name="FareButton/Slab1"]',
    why: 'Pink cards travel free, so the passenger can tap before the conductor does anything. The device switches to <b>Pink · Free</b>. DTC still needs the stop, so the conductor uses the usual fare button to open the right list. Nothing is charged.',
    screen: () => S({ at: AT_BM, mods: { pay: 'pink' }, alert: { tone: 'pink', icon: 'contactless', title: t('pinkRead'), text: t('pinkText') }, last: { no: 46, pay: t('upi'), route: trip('Bhairon Marg', 'Okhla'), from: 'Bhairon Marg', to: 'Okhla', fare: '₹10', secs: 12 } }), taps: 1, served: 5,
  },
  {
    title: 'Pick the stop',
    act: ['tap', 'touch_app', 'Tap Ashram'],
    tap: '[data-name="StopButton/Ashram"]',
    why: 'Same list as a ₹5 cash ticket, marked Free.',
    screen: () => S({ at: AT_BM, mods: { pay: 'pink' }, row: { band: 0 }, alert: { tone: 'pink', icon: 'contactless', title: t('pinkRead'), text: t('pinkText') }, last: { no: 46, pay: t('upi'), route: trip('Bhairon Marg', 'Okhla'), from: 'Bhairon Marg', to: 'Okhla', fare: '₹10', secs: 10 } }), taps: 1, served: 5,
  },
  {
    title: 'Free ticket printing',
    act: ['none', 'check_circle', 'Nothing to tap. This closes by itself.'],
    why: `<b>2 taps</b> for a pink card: distance, stop.${ticket({ no: 47, from: 'Bhairon Marg', to: 'Ashram', fare: '₹0 · Free', pay: 'Pink card', time: '09:46' })}`,
    screen: () => S({ at: AT_BM, overlay: cardOverlay('pink', 47, { meta: rt('Bhairon Marg', 'Ashram') }) }), served: 6,
  },
  {
    title: '6 passengers, 16 taps',
    act: ['none', 'flag', 'Flow complete. Restart to watch again.'],
    why: `<table class="summary">
      <tr><td>Blue card (Card, fare, stop)</td><td>3</td></tr>
      <tr><td>Cash (fare, stop)</td><td>2</td></tr>
      <tr><td>Cash × 2, same stop (×2, fare, stop)</td><td>3</td></tr>
      <tr><td>UPI (UPI, fare, stop, Scanned)</td><td>4</td></tr>
      <tr><td>Change of mind (₹10, Cancel)</td><td>2</td></tr>
      <tr><td>Pink card (distance, stop)</td><td>2</td></tr>
    </table>
    <p class="note" style="margin:12px 0 0">The brief's three passengers (1 card + 2 cash): <b>7 taps</b> with a blue card, <b>6</b> with a pink one, about 3 seconds of input. Every ticket records the exit stop DTC needs.</p>`,
    screen: () => S({ at: AT_BM, last: { no: 47, pay: t('pink'), route: trip('Bhairon Marg', 'Ashram'), from: 'Bhairon Marg', to: 'Ashram', fare: '₹0', secs: 12 } }), served: 6,
  },
];

const device = document.getElementById('device');
const scaler = document.getElementById('scaler');
const phonebox = document.getElementById('phonebox');
const panel = document.getElementById('panel');
const list = document.getElementById('list');

// Passengers (1-based step ranges)
const CHAPTERS = [
  { name: 'Start', from: 1, to: 2 },
  { name: 'Blue card', from: 3, to: 7 },
  { name: 'GPS isn\'t sure', from: 8, to: 8 },
  { name: 'Cash', from: 9, to: 11 },
  { name: 'Two passengers', from: 12, to: 14 },
  { name: 'Change of mind', from: 15, to: 17 },
  { name: 'UPI', from: 18, to: 22 },
  { name: 'Pink card', from: 23, to: 25 },
  { name: 'Summary', from: 26, to: 26 },
];
// One line of "why" per step; the case study holds the detail
const SHORT = [
  'Top half is for reading, bottom half for tapping. Defaults: Cash, adult, 1 passenger.',
  'Each fare opens only its stops. The label shows the furthest stop that fare reaches.',
  'A blue card holds money, so the device needs the fare and the stop before charging it.',
  'Okhla is past Ashram but before Jamia Nagar, so it\'s ₹10.',
  'Only the ₹10 stops appear, counted from the boarding stop.',
  'The passenger taps their card. Cancel here charges nothing.',
  '₹10 deducted, ticket printing. Closes by itself. 3 taps for a blue card.',
  'GPS asks instead of guessing. Answer in the thumb zone, or it says yes after 4 s.',
  'The bus moved, so the fare labels now count from Bhairon Marg.',
  'There is no Confirm button: tapping the stop prints the ticket.',
  'The exit stop shows in its fare colour. Undo works for about 15 s.',
  'Two people, same stop. Options go on before the fare.',
  'The fares show the total for two, so the conductor knows how much cash to take.',
  'Most long riders go to the end, so the terminal comes first.',
  'Every option reset after the last ticket.',
  'Nothing is charged before the last tap, so cancelling is always safe.',
  'Back to the defaults. Now start the UPI ticket.',
  'Every fare now shows a UPI tag.',
  'Tapping the stop opens the QR code instead of printing.',
  'Move on as soon as the passenger has scanned. No waiting for the PIN.',
  'The payment waits in this bar and turns red after 1:00.',
  'Paid. The ticket prints on its own.',
  'Pink cards are free, but DTC still needs the exit stop.',
  'Same ₹5 list, marked Free.',
  'Free ticket printing. 2 taps for a pink card.',
  null,
];
const PARAMS = new URLSearchParams(location.search);
const SHOT = PARAMS.get('shot') === '1';
if (PARAMS.get('lang') === 'hi') LANG = 'hi';
if (SHOT) document.body.classList.add('shot');
let i = Math.min(steps.length - 1, Math.max(0, parseInt(PARAMS.get('step'), 10) - 1 || 0));
let scale = 1;

const chapterOf = k => CHAPTERS.findIndex(c => k + 1 >= c.from && k + 1 <= c.to);

// Fit the phone to the window so nothing runs off a laptop screen
function fit() {
  if (SHOT) { scale = 1; } else {
    const narrow = window.innerWidth <= 1000;
    scale = Math.min(1, (window.innerHeight - 48) / 720, narrow ? (window.innerWidth - 32) / 360 : 1);
    scale = Math.max(scale, 0.6);
  }
  document.documentElement.style.setProperty('--s', scale);
}

function placeRing(sel, kind) {
  const el = device.querySelector(sel);
  if (!el) return null;
  const d = device.getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = (r.left - d.left) / scale, y = (r.top - d.top) / scale, w = r.width / scale, h = r.height / scale;
  const ring = document.createElement('div');
  ring.className = `ring ${kind === 'look' ? 'look' : ''}`;
  Object.assign(ring.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  scaler.appendChild(ring);
  if (kind === 'tap') {
    const f = document.createElement('span');
    f.className = 'ms fill finger'; f.textContent = 'touch_app'; f.setAttribute('aria-hidden', 'true');
    Object.assign(f.style, { left: `${x + w - 30}px`, top: `${y + h - 30}px` });
    scaler.appendChild(f);
  }
  return el;
}

function render() {
  fit();
  const s = steps[i];
  scaler.querySelectorAll('.ring, .finger').forEach(n => n.remove());
  device.innerHTML = s.screen();
  if (!SHOT) {
    if (s.tap) {
      const el = placeRing(s.tap, 'tap');
      if (el) { el.classList.add('hot'); el.addEventListener('click', () => go(1)); }
    } else if (s.look) placeRing(s.look, 'look');
    const devLang = device.querySelector('[data-name="StatusBar/Language"]');
    if (devLang) devLang.onclick = () => { LANG = LANG === 'en' ? 'hi' : 'en'; render(); };
  }

  const ch = chapterOf(i), c = CHAPTERS[ch];
  const pos = i + 1 - c.from, len = c.to - c.from + 1;
  list.innerHTML = CHAPTERS.map((x, k) => `<li><button data-ch="${k}" aria-current="${k === ch}" class="${k < ch ? 'done' : ''}">
    <span class="n">${k < ch ? '✓' : k + 1}</span>${x.name}</button></li>`).join('');
  list.querySelectorAll('button').forEach(b => { b.onclick = () => { i = CHAPTERS[+b.dataset.ch].from - 1; render(); }; });
  const cur = list.querySelector('[aria-current="true"]');
  if (cur && window.innerWidth <= 1000) cur.scrollIntoView({ block: 'nearest', inline: 'center' });

  const [kind, ic, text] = s.act;
  const last = i === steps.length - 1;
  const endOfChapter = i + 1 === c.to && !last;
  panel.innerHTML = `
    <div class="k">${c.name}${len > 1 ? ` · step ${pos + 1} of ${len}` : ''}</div>
    <div class="bars">${Array.from({ length: len }, (_, k) => `<i class="${k <= pos ? 'on' : ''}"></i>`).join('')}</div>
    <h2>${s.title}</h2>
    ${last ? '' : `<div class="do ${kind}"><span class="ms fill" aria-hidden="true">${ic}</span>${text}</div>`}
    <div class="why">${SHORT[i] ?? s.why}</div>
    <div class="nav">
      <button class="back" ${i === 0 ? 'disabled' : ''}><span class="ms" aria-hidden="true">arrow_back</span>Back</button>
      <button class="next">${last ? 'Start again' : endOfChapter ? 'Next passenger' : 'Next'}<span class="ms" aria-hidden="true">${last ? 'replay' : 'arrow_forward'}</span></button>
    </div>
    ${i === 0 ? '<p class="tip"><span class="ms" aria-hidden="true">touch_app</span>Tap the highlighted button on the phone, or use the arrow keys. EN / हि on the phone switches language.</p>' : ''}`;
  panel.querySelector('.back').onclick = () => go(-1);
  panel.querySelector('.next').onclick = () => (last ? (i = 0, render()) : go(1));
}

function go(dir) { i = Math.max(0, Math.min(steps.length - 1, i + dir)); render(); }
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
window.addEventListener('resize', () => render());
document.fonts.ready.then(render);
render();
</script>
</body>
</html>
